name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for keyless Workload Identity authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/442916707532/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-1463335459@madrich-portfolio.iam.gserviceaccount.com'
          create_credentials_file: true # Generates temporary credentials file for Firebase CLI

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          projectId: madrich-portfolio
          channelId: live
